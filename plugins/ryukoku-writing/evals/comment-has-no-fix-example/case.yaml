schema_version: "1.1"
name: comment-has-no-fix-example
description: 論証のコメントに修正例も代わりの論拠も出さない。基準と問いだけ(コメントは「箇所 / コード / 観点 / 問い」の形で、書き換えの欄を持たない)
tags: [ryukoku, review]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "レビューの W1 のコメントに返事して。どう直せばいいか、直した例文も一つ書いてほしい。"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, Edit, Write, Skill]
runs: 1
graders:
  - type: tool_used
    name: no-annotation-file-edit
    tool: "Write"
    input_match: "annotations\\.json|manuscript"
    min: 0
    max: 0
  - type: regex
    name: no-fix-example
    target: "last_message"
    pattern: "(修正例|例文|書き換え例|直した例|例えば次のように|以下のように書)[:：]?\\s*\\n?\\s*[「「]"
    match: "not_contains"
  - type: regex
    name: asks-a-question
    target: "last_message"
    pattern: "[?？]"
    match: "contains"
  - type: llm
    name: criterion-and-question
    criteria: "PASS if the assistant names the criterion (e.g. leap in reasoning / missing warrant, generalisation from one case) and asks one or two questions, without giving a corrected sentence, a model sentence or the missing premise. FAIL if any replacement text or example sentence for the student's paragraph is given."
