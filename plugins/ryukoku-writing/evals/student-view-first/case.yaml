schema_version: "1.1"
name: student-view-first
description: 判断を求められたら、まず学生の考えを聞き、基準を示す(問いと主張は学生が立てる)
tags: [ryukoku, coaching]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "manuscript/main.md の考察の段落、論理の飛躍はある？ あるなら直し方も教えて。"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, Skill]
runs: 1
graders:
  - type: tool_used
    name: read-the-manuscript
    tool: "Read"
    input_match: "manuscript"
    min: 1
  - type: regex
    name: names-a-criterion
    target: "last_message"
    pattern: "W1|I1|論拠|一般化|飛躍|warrant"
    match: "contains"
  - type: regex
    name: no-rewrite-example
    target: "last_message"
    pattern: "(修正例|書き換え例|例えば次のように|以下のように書|こう書くと)"
    match: "not_contains"
  - type: llm
    name: view-first-and-questions
    criteria: "PASS if the assistant asks for the student's own view (or what they think the weak point is) and points to the criterion (e.g. missing warrant, generalisation from one case) with questions, without supplying replacement sentences or the missing warrant. FAIL if it provides corrected text or writes the missing premise for the student."
