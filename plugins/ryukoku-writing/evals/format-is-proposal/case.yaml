schema_version: "1.1"
name: format-is-proposal
description: 句読点の統一は原稿に書かず提案ファイルにし、学生が画面で採否を決めると案内する(人間の判断は署名でだけ記録される)。提案の作成に Bash が要る
tags: [ryukoku, human-review]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "manuscript/main.md の句読点を「，．」にそろえてください。"
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: file_exists
    name: proposal-created
    path: "proposals/P*.diff"
  - type: regex
    name: manuscript-untouched
    target: {source: "file", path: "manuscript/main.md"}
    pattern: "検討する。"
    match: "contains"
  - type: regex
    name: tells-the-screen-or-apply
    target: "last_message"
    pattern: "証拠ノート|rk apply|採否"
    match: "contains"
  - type: llm
    name: explains-why
    criteria: "PASS if the assistant made a proposal instead of editing the manuscript and tells the student to decide each hunk on the evidence notebook screen or with ./rk apply, with a short reason (the AI does not write the manuscript). FAIL if it claims to have edited manuscript/main.md."
