# Markdown -> PDF。LuaLaTeX + LuaTeX-ja(jlreq か ltjsarticle)。和文フォントは TeX Live 2020 以降の既定(原ノ味)。
from: markdown+east_asian_line_breaks
to: pdf
pdf-engine: lualatex
citeproc: true
# 文献一覧は書き出しのたびに台帳(sources/register.csv)から作る。ここでは bibliography を指定しない
variables:
  documentclass: ltjsarticle   # または jlreq(LuaLaTeX + LuaTeX-ja。TeX Live の collection-langjapanese に含まれる)
  papersize: a4
# lang は設定しない: lang があると pandoc の LaTeX テンプレートが babel を読み込み、babel と jlreq / LuaTeX-ja の組み合わせは未確認のため。
# lang is deliberately not set: with lang, pandoc's LaTeX template loads babel, and babel with jlreq / LuaTeX-ja is unverified.
# (pandoc templates, common.latex: https://github.com/jgm/pandoc/blob/main/data/templates/common.latex)
